import java.util.Properties
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

android {
    namespace 'it.vintedaffari.app'
    compileSdk 35

    defaultConfig {
        applicationId 'it.vintedaffari.app'
        minSdk 28
        targetSdk 35
        testInstrumentationRunner project.findProperty('LUDO_AI_TEST') ? 'it.vintedaffari.app.AiBetaInstrumentation' : project.findProperty('LUDO_AUDIT_TEST') ? 'it.vintedaffari.app.AuditExportInstrumentation' : 'it.vintedaffari.app.BrowserVisualInstrumentation'

        // CI supplies a monotonic build number. Local workstation builds must also stay
        // upgrade-compatible with the installed beta because cloud Actions may be unavailable.
        def ciVersionCode = System.getenv('LUDO_VERSION_CODE')
        versionCode ciVersionCode ? (1000000 + ciVersionCode.toInteger()) : 1002033
        // Only the owner-approved Telegram release builder supplies a beta version name.
        // Normal local builds retain the existing version unchanged.
        def releaseVersionName = System.getenv('LUDO_VERSION_NAME')
        if (releaseVersionName && !(releaseVersionName ==~ /5\.12\.\d{1,4}-beta/)) {
            throw new GradleException('Invalid LUDO_VERSION_NAME for local beta release')
        }
        versionName releaseVersionName ?: '5.12.202-ai-wait-deadline'

        def secrets = new Properties()
        def secretsFile = rootProject.file('secrets.properties')
        if (secretsFile.exists()) secretsFile.withInputStream { secrets.load(it) }
        // Secret lookup order: user Gradle property -> CI environment -> legacy local file.
        // This keeps BGG_TOKEN out of Git and removes the need to edit secrets.properties per build.
        def globalToken = project.findProperty('BGG_TOKEN') ?: ''
        def envToken = System.getenv('BGG_TOKEN') ?: ''
        def fileToken = secrets.getProperty('BGG_TOKEN', '') ?: ''
        def rawToken = globalToken ? globalToken : (envToken ? envToken : fileToken)
        def bggToken = rawToken.replace('\\', '\\\\').replace('"', '\\"')
        buildConfigField 'String', 'BGG_TOKEN', '"' + bggToken + '"'
        // Optional Firestore client configuration. The Firebase console download is
        // app/google-services.json, excluded from Git by .gitignore. Never commit it.
        // A malformed/mismatched local file is an error rather than silent cross-project use.
        def firebaseClient = [:]
        def firebaseFile = project.file('google-services.json')
        if (firebaseFile.isFile()) {
            def firebaseJson
            try {
                firebaseJson = new JsonSlurper().parseText(firebaseFile.getText('UTF-8'))
            } catch (Exception failure) {
                throw new GradleException('Invalid app/google-services.json; download it again from Firebase.', failure)
            }
            def projectId = firebaseJson?.project_info?.project_id?.toString()
            def projectNumber = firebaseJson?.project_info?.project_number?.toString()
            def clients = firebaseJson?.client instanceof List ? firebaseJson.client : []
            def matchingClients = clients.findAll {
                it?.client_info?.android_client_info?.package_name == applicationId
            }
            if (projectId != 'ludo-scout' || !projectNumber || matchingClients.size() != 1) {
                throw new GradleException('Firebase project or Android package does not match Ludo Scout.')
            }
            def client = matchingClients[0]
            def firebaseAppId = client?.client_info?.mobilesdk_app_id?.toString()
            def keys = client?.api_key instanceof List ? client.api_key : []
            def apiKey = keys.find { it?.current_key instanceof String && it.current_key.trim() }?.current_key?.trim()
            if (!firebaseAppId?.startsWith("1:${projectNumber}:android:") || !apiKey) {
                throw new GradleException('Firebase Android app ID or API key is missing.')
            }
            firebaseClient = [
                LUDO_FIREBASE_APP_ID: firebaseAppId,
                LUDO_FIREBASE_API_KEY: apiKey,
                LUDO_FIREBASE_PROJECT_ID: projectId
            ]
        }

        // Build overrides still work for unattended Hermes builds. The authorized UID is
        // an account identifier (not a credential); Firestore rules enforce it server-side.
        def firebaseOwnerUid = 'FxAKNm8aK6amBPoHZcXNOtSLv3t2'
        ['LUDO_FIREBASE_APP_ID','LUDO_FIREBASE_API_KEY','LUDO_FIREBASE_PROJECT_ID','LUDO_SYNC_OWNER_UID'].each { key ->
            def fallback = key == 'LUDO_SYNC_OWNER_UID' ? firebaseOwnerUid : (firebaseClient[key] ?: '')
            def raw = (project.findProperty(key) ?: System.getenv(key) ?: fallback).toString()
            def escaped = raw.replace('\\', '\\\\').replace('"', '\\"')
            buildConfigField 'String', key, '"' + escaped + '"'
        }
    }

    signingConfigs {
        debug {
            // CI restores the same long-lived debug keystore used by the installed beta.
            // Use an explicit path so Gradle cannot silently fall back to a runner-local key.
            storeFile file(System.getenv('ANDROID_DEBUG_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1'; implementation 'androidx.core:core:1.13.1'; implementation 'androidx.work:work-runtime:2.9.1'; testImplementation 'junit:junit:4.13.2' }
// Align transitive Kotlin runtimes from AndroidX/ML Kit, including legacy jdk7/jdk8 artifacts.
dependencies { implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22') }








// Origin-scoped message bridge and document-start script for the passive browser experiment.
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }












dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    // WorkManager's ListenableFuture must be present on the compile classpath.
    implementation 'com.google.guava:guava:33.6.0-android'
}
