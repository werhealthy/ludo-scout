name: Opt-in free Gemini benchmark
on:
  workflow_dispatch:
    inputs:
      confirm_free_tier:
        description: 'Confirm this API key project has no paid billing. 64 records / 8 calls / expected EUR0; conservative reserved ceiling EUR0.08.'
        type: boolean
        required: true
        default: false
      resume_source_run:
        description: 'Optional completed benchmark run ID to continue. Reuse validated answers; process only missing records within remaining monthly limits. Empty starts original benchmark.'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: classification-ai-ledger
  cancel-in-progress: false
jobs:
  benchmark:
    # Disabled for cutover: all future provider attempts must use the global AI service ledger.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Offline tests (no provider credentials)
        run: |
          python3 regression/classification_benchmark_test.py
          python3 regression/classification_runner_test.py
          python3 regression/classification_resume_test.py
          python3 regression/classification_resume_execute_test.py
      - name: Bounded manual benchmark (no retries)
        env:
          AI_BENCHMARK_ENABLED: ${{ vars.AI_BENCHMARK_ENABLED }}
          RESUME_SOURCE_RUN: ${{ inputs.resume_source_run }}
          CONFIRM_FREE_TIER: ${{ inputs.confirm_free_tier }}
          AI_MONTHLY_BUDGET_EUR: ${{ vars.AI_MONTHLY_BUDGET_EUR || '1' }}
          AI_BATCH_BUDGET_EUR: ${{ vars.AI_BATCH_BUDGET_EUR || '.10' }}
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/classification_resume_execute.py
