name: Android beta

on:
  workflow_dispatch:
  push:
    branches:
      - beta

permissions:
  contents: read

jobs:
  build:
    name: Build signed debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Android SDK
        run: |
          test -n "$ANDROID_HOME" || (echo "ANDROID_HOME is not set" && exit 1)
          test -d "$ANDROID_HOME" || (echo "Android SDK directory not found: $ANDROID_HOME" && exit 1)
          echo "Using Android SDK at $ANDROID_HOME"

      - name: Validate required secrets
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          test -n "$BGG_TOKEN" || (echo "Missing GitHub secret: BGG_TOKEN" && exit 1)
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || (echo "Missing GitHub secret: ANDROID_DEBUG_KEYSTORE_BASE64" && exit 1)
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_JSON" && exit 1)
          test -n "$FIREBASE_APP_ID" || (echo "Missing GitHub secret: FIREBASE_APP_ID" && exit 1)
          test -n "$FIREBASE_TESTERS" || (echo "Missing GitHub secret: FIREBASE_TESTERS" && exit 1)

      - name: Restore existing Android debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Show signing certificate fingerprint
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            | grep -E 'Alias name:|SHA256:' || true

      - name: Run performance stability regression
        run: python3 regression/performance_stability_v5124.py
      - name: Run BGG identity provenance regression
        run: python3 regression/bgg_identity_provenance_v5125.py
      - name: Run historical BGG revalidation regression
        run: python3 regression/historical_bgg_revalidation_v5126.py
      - name: Run BGG local-index performance regression
        run: python3 regression/bgg_local_index_performance_v5128.py
      - name: Run historical BGG drain scheduling regression
        run: python3 regression/historical_bgg_drain_scheduling_v5129.py
      - name: Run BGG fuzzy-index performance regression
        run: python3 regression/bgg_fuzzy_index_performance_v51210.py
      - name: Run BGG state monotonicity regression
        run: python3 regression/bgg_state_monotonicity_v51211.py
      - name: Run BGG review-write accountability regression
        run: python3 regression/bgg_review_write_accountability_v51212.py
      - name: Run BGG cold-index single-flight regression
        run: python3 regression/bgg_cold_index_singleflight_v51213.py
      - name: Run BGG version-affinity regression
        run: python3 regression/bgg_version_affinity_v51214.py
      - name: Run executable SQLite BGG state-machine integration
        run: python3 regression/bgg_sqlite_state_machine_v51215.py
      - name: Run multi-process crash diagnostics regression
        run: python3 regression/process_crash_diagnostics_v51215.py
      - name: Run Motore epoch/progress stability regression
        run: python3 regression/engine_epoch_progress_stability_v51216.py
      - name: Run acquisition/crash stability regression
        run: python3 regression/engine_acquisition_crash_stability_v51217.py
      - name: Run WorkManager/main-thread stability regression
        run: python3 regression/workmanager_mainthread_stability_v51218.py
      - name: Run queue single-owner/engine-order regression
        run: python3 regression/queue_single_owner_engine_order_v51219.py
      - name: Run engine cross-process telemetry regression
        run: python3 regression/engine_runtime_cross_process_v51220.py
      - name: Run product turnaround SLA/trust regression
        run: python3 regression/product_turnaround_sla_trust_v51221.py
      - name: Run BGG exact-index / no-timeout-review regression
        run: python3 regression/bgg_exact_index_no_timeout_review_v51222.py
      - name: Run review/fuzzy/queue truth regression
        run: python3 regression/review_fuzzy_queue_truth_v51223.py
      - name: Run adaptive Motore timing regression
        run: python3 regression/engine_adaptive_timing_v51224.py
      - name: Run adaptive Motore fairness regression
        run: python3 regression/engine_adaptive_fairness_v51225.py
      - name: Run recovery/review/price gates regression
        run: python3 regression/recovery_review_price_gates_v51226.py
      - name: Run queue liveness/catalog truth regression
        run: python3 regression/queue_liveness_catalog_truth_v51227.py

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          ANDROID_DEBUG_KEYSTORE: ${{ runner.temp }}/ludo-debug.keystore
          # 1,000,000 + GitHub's monotonically increasing run number.
          # This stays safely above the historical local versionCode 118.
          LUDO_VERSION_CODE: ${{ github.run_number }}
        run: |
          cp "$HOME/.android/debug.keystore" "$ANDROID_DEBUG_KEYSTORE"
          echo "Building beta run number=$LUDO_VERSION_CODE"
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify built APK signing certificate
        run: |
          EXPECTED_SHA256="C7DF7C31D0FE0D059307F4DE7B67BE5992DC87EC73E623CC9E8B4E87C63D8710"
          ACTUAL_SHA256="$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          echo "Built APK signer SHA256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || (echo "Unexpected APK signing certificate" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-scout-beta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Distribute beta to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          npx --yes firebase-tools@latest appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --testers "$FIREBASE_TESTERS" \
            --release-notes "Ludo Scout beta - GitHub run #${{ github.run_number }} (${{ github.sha }})"
