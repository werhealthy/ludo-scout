name: Offline classification benchmark
on:
  pull_request:
    branches: [beta]
    paths:
      - 'tools/classification*.py'
      - 'regression/classification_runner_test.py'
      - 'regression/classification_resume_test.py'
      - 'regression/classification_resume_execute_test.py'
      - 'regression/fixtures/classification_*64.json'
      - '.github/workflows/classification-ai-benchmark.yml'
      - 'regression/classification_benchmark_test.py'
      - 'regression/fixtures/classification_smoke.json'
      - '.github/workflows/classification-benchmark.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: python3 regression/classification_benchmark_test.py
      - run: python3 regression/classification_runner_test.py

      - run: python3 regression/classification_resume_test.py

      - run: python3 regression/classification_resume_execute_test.py
