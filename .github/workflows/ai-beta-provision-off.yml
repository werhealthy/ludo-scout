name: AI beta private provision OFF
on:
  workflow_dispatch:
    inputs:
      free_projects_confirmed:
        description: "Confirmed Workers Free and GitHub Gemini key belongs to Ludo scout Free Tier, no billing"
        required: true
        type: boolean
        default: false
      device_digest:
        description: "SHA256 of the owner's private phone token (never the token itself)"
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ai-beta-cloudflare-deploy
  cancel-in-progress: false
jobs:
  provision-off:
    if: github.ref == 'refs/heads/beta' && inputs.free_projects_confirmed == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai-beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify legacy route disabled
        env:
          GH_TOKEN: ${{ github.token }}
          AI_BENCHMARK_ENABLED: ${{ vars.AI_BENCHMARK_ENABLED }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.env.AI_BENCHMARK_ENABLED, 'false');
          const base='https://api.github.com/repos/werhealthy/ludo-scout/actions/workflows/classification-ai-benchmark.yml';
          const get=async url=>{
            const r=await fetch(url,{headers:{authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
            assert.equal(r.status,200);
            return r.json();
          };
          assert.equal((await get(base)).state,'disabled_manually');
          assert.ok((await get(base+'/runs?per_page=100')).workflow_runs.every(r=>r.status==='completed'));
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ai-benchmark-ledger
          path: ledger-source
          persist-credentials: false
      - name: Prepare private server configuration
        env:
          AI_BENCHMARK_ENABLED: ${{ vars.AI_BENCHMARK_ENABLED }}
          FREE_PROJECTS_CONFIRMED: ${{ inputs.free_projects_confirmed }}
          DEVICE_DIGEST: ${{ inputs.device_digest }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/ai-private-provision"
          node scripts/provision.mjs prepare "$GITHUB_WORKSPACE/ledger-source/ledger.json" "$RUNNER_TEMP/ai-private-provision"
      - name: Validate OFF configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          assert.equal(c.name,'ludo-ai-beta');
          assert.equal(c.vars.ENABLED,'false');
          assert.equal(c.vars.FREE_TIER_VALID_UNTIL,'0');
          NODE
      - name: Publish private configuration with AI OFF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --var ENABLED:false --var FREE_TIER_VALID_UNTIL:0 --secrets-file "$RUNNER_TEMP/ai-private-provision/secrets.json"
      - name: Verify imported counter without a provider call
        run: node scripts/provision.mjs verify "$GITHUB_WORKSPACE/ledger-source/ledger.json" "$RUNNER_TEMP/ai-private-provision"
      - name: Revoke temporary verification credential
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if test -f "$RUNNER_TEMP/ai-private-provision/cleanup.json"; then
            npx wrangler secret bulk "$RUNNER_TEMP/ai-private-provision/cleanup.json"
          fi
      - name: Delete runner private files
        if: always()
        run: rm -f "$RUNNER_TEMP/ai-private-provision/secrets.json" "$RUNNER_TEMP/ai-private-provision/cleanup.json" "$RUNNER_TEMP/ai-private-provision/probe-token"
      - name: Record verified scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          AI remains OFF. Gemini key transferred server-side, fresh historical reservations imported and authenticated status matched them. Temporary verification credential revoked; one owner phone digest remains. No classification/provider request was made.
          TEXT
