name: AI beta service safeguards
on:
  pull_request:
    branches: [beta]
    paths: ['services/ai-beta/**', '.github/workflows/ai-beta-service.yml', '.github/workflows/ai-beta-deploy-off.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/ai-beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/ai-beta-bundle

      - name: Verify pinned private provisioning CLI
        run: |
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('/tmp/ai-provision-cli.json', JSON.stringify({GEMINI_API_KEY:'offline-test',SEED_MANIFEST:'offline-test',DEVICE_DIGESTS:'{}'}), {mode:0o600});"
          npx wrangler deploy --dry-run --secrets-file /tmp/ai-provision-cli.json --outdir /tmp/ai-provision-bundle
          npx wrangler secret bulk --help
          rm -f /tmp/ai-provision-cli.json
