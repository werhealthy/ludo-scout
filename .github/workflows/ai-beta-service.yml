name: AI beta service safeguards
on:
  pull_request:
    branches: [beta]
    paths: ['services/ai-beta/**', '.github/workflows/ai-beta-service.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/ai-beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/ai-beta-bundle
