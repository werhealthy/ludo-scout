name: Android PR validation

on:
  pull_request:
    branches:
      - beta

permissions:
  contents: read

jobs:
  validate:
    name: Regressions and Java compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Android SDK
        run: |
          test -n "$ANDROID_HOME" || (echo "ANDROID_HOME is not set" && exit 1)
          test -d "$ANDROID_HOME" || (echo "Android SDK directory not found: $ANDROID_HOME" && exit 1)

      - name: Run performance stability regression
        run: python3 regression/performance_stability_v5124.py

      - name: Run BGG identity provenance regression
        run: python3 regression/bgg_identity_provenance_v5125.py
      - name: Run historical BGG revalidation regression
        run: python3 regression/historical_bgg_revalidation_v5126.py
      - name: Run BGG local-index performance regression
        run: python3 regression/bgg_local_index_performance_v5128.py
      - name: Run historical BGG drain scheduling regression
        run: python3 regression/historical_bgg_drain_scheduling_v5129.py
      - name: Run BGG fuzzy-index performance regression
        run: python3 regression/bgg_fuzzy_index_performance_v51210.py
      - name: Run BGG state monotonicity regression
        run: python3 regression/bgg_state_monotonicity_v51211.py
      - name: Run BGG review-write accountability regression
        run: python3 regression/bgg_review_write_accountability_v51212.py
      - name: Run BGG cold-index single-flight regression
        run: python3 regression/bgg_cold_index_singleflight_v51213.py

      - name: Compile debug Java
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
