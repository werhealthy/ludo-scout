name: Android PR validation

on:
  pull_request:
    branches:
      - beta

permissions:
  contents: read

jobs:
  validate:
    name: Regressions and Java compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify supplied Ludo visual universe
        run: python3 regression/ludo_visual_universe.py
      - name: Run featured pedestal regression
        run: python3 regression/featured_pedestal_v51296.py
      - name: Run Home reference and waiting scroll regression
        run: python3 regression/home_engine_reference_v51295.py
      - name: Run indexed engine join regression
        run: python3 regression/engine_join_plan_v51294.py
      - name: Run Home layout and loading regression
        run: python3 regression/home_render_v51290.py
      - name: Run Discover visual polish regression
        run: python3 regression/discover_visual_polish_v51276.py
      - name: Run queue liveness diagnostics regression
        run: python3 regression/queue_liveness_diagnostics_v51277.py
      - name: Run queue performance metrics regression
        run: python3 regression/engine_performance_metrics_v51279.py


      - name: Run passive Vinted browser capture behavior
        run: node --test regression/vinted_browser_capture.test.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Vinted browser redesign states
        run: python3 regression/vinted_browser_redesign.py

      - name: Verify Ludo daily journey and exploration
        run: |
          python3 regression/ludo_exploration.py
          python3 regression/ludo_journey_layout.py
          python3 regression/browser_page_progress.py

      - name: Verify durable browser engine intake
        run: |
          python3 regression/browser_engine_intake.py
          python3 regression/browser_engine_boundary.py
          python3 regression/engine_local_activity.py

      - name: Verify startup never invokes destructive legacy reset
        run: python3 regression/startup_reset_disabled.py

      - name: Run Vinted photo cache reuse behavior
        run: python3 regression/photo_cache_reuse.py

      - name: Run radar reliability and capture funnel regression
        run: python3 regression/radar_reliability.py
      - name: Run database contention trace behavior regression
        run: python3 regression/db_contention_trace.py

      - name: Run game favorites and durable Ludo memory regression
        run: python3 regression/game_preferences_v512110.py

      - name: Run contextual product customization regression
        run: python3 regression/product_customization_v512113.py

      - name: Run premium scene geometry regression
        run: python3 regression/premium_scene_v512111.py

      - name: Run Home box geometry regression
        run: python3 regression/home_box_v512109.py

      - name: Run pet suggestion and lifecycle regression
        run: python3 regression/ludo_pet_v512108.py

      - name: Verify Ludo monthly offers and paired Library shelves
        run: |
          python3 regression/ludo_monthly_overview.py
          python3 regression/ludo_offers_shelves.py

      - name: Run Library migration and personal rating regression
        run: python3 regression/library_data_v512107.py

      - name: Run Library async save behavior regression
        run: python3 regression/library_write_ui_v512107.py

      - name: Run Home media recovery behavior regression
        run: python3 regression/home_media_v512119.py

      - name: Run read-only startup reset evidence regression
        run: python3 regression/engine_reset_evidence.py

      - name: Run engine diagnostic local-only SQLite regression
        run: python3 regression/engine_diagnostic_local_only.py

      - name: Run Motore live identity SQLite regression
        run: python3 regression/engine_live_counts.py

      - name: Run Motore overview presentation regression
        run: python3 regression/engine_overview_presentation.py

      - name: Run product pull motion regression
        run: python3 regression/product_pull_motion.py

      - name: Run refresh and end-pull integration regression
        run: python3 regression/refresh_end_pull.py

      - name: Run product gesture behavior regression
        run: python3 regression/product_gesture_v512106.py

      - name: Run Catalog navigation behavior regression
        run: python3 regression/market_navigation_v512105.py

      - name: Run engine performance metrics behavior regression
        run: |
          mkdir -p .regression-build
          javac -d .regression-build app/src/main/java/it/vintedaffari/app/EnginePerformanceMetrics.java regression/EnginePerformanceMetricsRegression.java
          java -cp .regression-build EnginePerformanceMetricsRegression

      - name: Run Home category SQLite fixtures
        run: python3 regression/discover_category_sql_v51284.py

      - name: Run global pending intake SQLite fixtures
        run: python3 regression/engine_intake_sql_v51294.py
      - name: Run exclusive Motore pipeline SQLite fixtures
        run: python3 regression/engine_pipeline_sql_v51286.py

      - name: Validate Android SDK
        run: |
          test -n "$ANDROID_HOME" || (echo "ANDROID_HOME is not set" && exit 1)
          test -d "$ANDROID_HOME" || (echo "Android SDK directory not found: $ANDROID_HOME" && exit 1)

      - name: Run pipeline integrity source regression
        run: python3 regression/pipeline_integrity_v51242.py
      - name: Run queue ownership/activity cadence regression
        run: python3 regression/runtime_ownership_v51244.py
      - name: Run Activity snapshot regression
        run: python3 regression/activity_snapshot_v51245.py
      - name: Run pipeline BGG compatibility fixtures
        run: |
          mkdir -p .regression-build
          javac -d .regression-build regression/PipelineIntegrityRegression.java app/src/main/java/it/vintedaffari/app/BggProductCompatibility.java
          java -cp .regression-build PipelineIntegrityRegression

      - name: Run performance stability regression
        run: python3 regression/performance_stability_v5124.py

      - name: Run BGG identity provenance regression
        run: python3 regression/bgg_identity_provenance_v5125.py
      - name: Run historical BGG revalidation regression
        run: python3 regression/historical_bgg_revalidation_v5126.py
      - name: Run BGG local-index performance regression
        run: python3 regression/bgg_local_index_performance_v5128.py
      - name: Run historical BGG drain scheduling regression
        run: python3 regression/historical_bgg_drain_scheduling_v5129.py
      - name: Run BGG fuzzy-index performance regression
        run: python3 regression/bgg_fuzzy_index_performance_v51210.py
      - name: Run BGG state monotonicity regression
        run: python3 regression/bgg_state_monotonicity_v51211.py
      - name: Run BGG review-write accountability regression
        run: python3 regression/bgg_review_write_accountability_v51212.py
      - name: Run BGG cold-index single-flight regression
        run: python3 regression/bgg_cold_index_singleflight_v51213.py
      - name: Run BGG version-affinity regression
        run: python3 regression/bgg_version_affinity_v51214.py
      - name: Run executable SQLite BGG state-machine integration
        run: python3 regression/bgg_sqlite_state_machine_v51215.py
      - name: Run multi-process crash diagnostics regression
        run: python3 regression/process_crash_diagnostics_v51215.py
      - name: Run 24-hour catalog pipeline diagnostics regression
        run: python3 regression/catalog_pipeline_breakdown_v51255.py
      - name: Run cross-process Accessibility intake telemetry regression
        run: python3 regression/a11y_cross_process_intake_v51256.py
      - name: Run Motore UI clarity regression
        run: python3 regression/engine_ui_clarity_v51257.py
      - name: Run Vinted alternate-title photo-proof regression
        run: python3 regression/vinted_alternate_title_photo_proof_v51258.py
      - name: Run startup processing-lease recovery regression
        run: python3 regression/startup_processing_lease_recovery_v51259.py
      - name: Run Vinted missing-link breakdown regression
        run: python3 regression/vinted_missing_breakdown_v51260.py
      - name: Run catalog visibility breakdown regression
        run: python3 regression/catalog_visibility_breakdown_v51261.py
      - name: Run canonical Catalog bridge regression
        run: python3 regression/catalog_canonical_bridge_v51262.py
      - name: Run canonical product-type evidence regression
        run: python3 regression/catalog_bridge_type_evidence_v51262.py
      - name: Run existing canonical Catalog recovery regression
        run: python3 regression/catalog_bridge_backfill_v51262.py
      - name: Run opened Vinted verification priority regression
        run: python3 regression/opened_vinted_verification_priority_v51263.py
      - name: Run Vinted request-efficiency regression
        run: python3 regression/vinted_request_efficiency_v51264.py
      - name: Run manual Vinted UI ANR regression
        run: python3 regression/manual_vinted_ui_anr_v51265.py
      - name: Run Motore epoch/progress stability regression
        run: python3 regression/engine_epoch_progress_stability_v51216.py
      - name: Run acquisition/crash stability regression
        run: python3 regression/engine_acquisition_crash_stability_v51217.py
      - name: Run WorkManager/main-thread stability regression
        run: python3 regression/workmanager_mainthread_stability_v51218.py
      - name: Run queue stall recovery regression
        run: python3 regression/queue_stall_recovery_v51267.py
      - name: Run queue single-owner/engine-order regression
        run: python3 regression/queue_single_owner_engine_order_v51219.py
      - name: Run engine cross-process telemetry regression
        run: python3 regression/engine_runtime_cross_process_v51220.py
      - name: Run product turnaround SLA/trust regression
        run: python3 regression/product_turnaround_sla_trust_v51221.py
      - name: Run BGG exact-index / no-timeout-review regression
        run: python3 regression/bgg_exact_index_no_timeout_review_v51222.py
      - name: Run review/fuzzy/queue truth regression
        run: python3 regression/review_fuzzy_queue_truth_v51223.py
      - name: Run adaptive Motore timing regression
        run: python3 regression/engine_adaptive_timing_v51224.py
      - name: Run adaptive Motore fairness regression
        run: python3 regression/engine_adaptive_fairness_v51225.py
      - name: Run recovery/review/price gates regression
        run: python3 regression/recovery_review_price_gates_v51226.py
      - name: Run queue liveness/catalog truth regression
        run: python3 regression/queue_liveness_catalog_truth_v51227.py
      - name: Run deferred queue truth regression
        run: python3 regression/regression_deferred_run_truth_v51278.py
      - name: Run queue retry diagnostics regression
        run: python3 regression/queue_retry_diagnostics_v51273.py
      - name: Run queue notification truth regression
        run: python3 regression/queue_notification_truth_v51274.py
      - name: Run catalog freshness/bundle health/ETA regression
        run: python3 regression/catalog_freshness_bundle_health_eta_v51228.py
      - name: Run Motore network-priority regression
        run: python3 regression/motore_network_priority_v51229.py
      - name: Run Motore recovery/truth regression
        run: python3 regression/engine_recovery_truth_v51230.py
      - name: Run review actions/bundle memory regression
        run: python3 regression/review_actions_bundle_memory_v51231.py
      - name: Run sold reconciliation/next-action regression
        run: python3 regression/sold_reconcile_next_action_v51232.py
      - name: Run catalog truth/card layout/bundle memory regression
        run: python3 regression/catalog_truth_card_layout_bundle_memory_v51233.py
      - name: Run global rating sweep regression
        run: python3 regression/global_rating_sweep_v51234.py
      - name: Run pricing/bundle decision regression
        run: python3 regression/pricing_bundle_decisions_v51235.py
      - name: Run safe-mode pricing/quality/scan regression
        run: python3 regression/safe_mode_quality_scan_v51268.py
      - name: Run single-owner startup-maintenance regression
        run: python3 regression/single_owner_startup_maintenance_v51269.py
      - name: Run UX phase 2 regression
        run: python3 regression/ux_phase2_v51237.py
      - name: Run Home/manual sold UX regression
        run: python3 regression/home_manual_sold_v51238.py
      - name: Run UX system v1 regression
        run: python3 regression/ux_system_v1_v51239.py
      - name: Run connected product graph UX regression
        run: python3 regression/connected_product_graph_v51240.py
      - name: Run invisible-interaction UX regression
        run: python3 regression/invisible_interaction_v51241.py
      - name: Run unified catalog and bundle workflow regression
        run: python3 regression/catalog_bundle_workflow.py
      - name: Run pricing unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Compile debug Java
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac


      - name: Create temporary review-only debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 2 -dname "CN=PR Review,O=Ludo Scout,C=IT"
      - name: Build review APK
        run: ./gradlew --no-daemon :app:assembleDebug








      - name: Build platform-only browser visual test APK
        if: github.head_ref == 'frontend/vinted-browser-redesign'
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest
      - name: Render actual browser states on Android emulator
        if: github.head_ref == 'frontend/vinted-browser-redesign'
        timeout-minutes: 10
        run: |
          sudo chmod 666 /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force -n ludo-browser -k "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd ludo-browser -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emulator.log 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell wm size 1080x1920
          adb shell wm density 440
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb logcat -c
          adb shell am instrument -w it.vintedaffari.app.test/it.vintedaffari.app.BrowserVisualInstrumentation | tee browser-visual-result.txt
          adb logcat -d -s LudoVisual:I '*:S'
          rg 'Three actual browser states rendered' browser-visual-result.txt
          adb shell settings put system font_scale 2.0
          adb logcat -c
          adb shell am instrument -w it.vintedaffari.app.test/it.vintedaffari.app.BrowserVisualInstrumentation | tee browser-large-result.txt
          adb logcat -d -s LudoVisual:I '*:S'
          rg 'Three actual browser states rendered' browser-large-result.txt
