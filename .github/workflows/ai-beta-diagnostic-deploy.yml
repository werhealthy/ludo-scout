name: AI beta diagnostic deploy OFF
on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/ai-beta-diagnostic-deploy.yml'

permissions:
  contents: read

concurrency:
  group: ai-beta-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy-diagnostic-off:
    if: github.ref == 'refs/heads/beta' && contains(github.event.head_commit.message, 'Deploy AI broker diagnostic OFF')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai-beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify fail-closed configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          assert.equal(c.name,'ludo-ai-beta');
          assert.equal(c.vars.ENABLED,'false');
          assert.equal(c.vars.FREE_TIER_VALID_UNTIL,'0');
          assert.equal(c.observability.enabled,false);
          NODE
      - run: npx wrangler deploy --dry-run --outdir /tmp/ai-beta-diagnostic-bundle
      - name: Publish diagnostic broker with AI OFF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --var ENABLED:false --var FREE_TIER_VALID_UNTIL:0
      - name: Record scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TEXT'
          Published current beta broker diagnostics with AI OFF and Gemini window closed.
          Existing Cloudflare secrets are preserved; no provider request is made by this workflow.
          TEXT
